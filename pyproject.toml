[project]
name = "passion"
version = "0.1.0"
description = "Korean fashion trend collection, analysis and forecasting (Naver API HUB + KOSIS + LLM + ML)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
trends = ["trendspy>=0.1.6"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
passion = "fashion_trend.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
