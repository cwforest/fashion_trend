# 시드 키워드 — 발굴의 출발점
#
# 이 목록 자체가 분석 대상은 아니다. 두 발굴 경로의 **입력**이다.
#   경로 B(검색광고 연관어): discovery 시드를 hintKeywords 로 넣어 연관어를 받는다
#   경로 A(LLM 웹검색):      시드를 축으로 최신 기사에서 신규 표현을 찾는다
#
# 원칙
#   - 품목(아이템) 수준의 **핵 명사**만 둔다. "버건디 가디건" 같은 조합어는 발굴 결과지 시드가 아니다
#     (한국어 명사 합성은 핵이 마지막 — '니트가디건' ≠ '가디건니트'. 실측: 지수 41.2 vs 1.2)
#   - 10~20대 여성 의류에 한정 (config.yaml primary_segment 와 일치)
#   - 성별·연령은 **시드에 붙이지 않는다.** 쇼핑인사이트 조회 파라미터로 건다
#     ('여성가디건' 을 키워드로 치면 양자화 바닥에 눌린다)
#
# ── role / v0 ────────────────────────────────────────────────────────
#   discovery : 연관어를 받아 격자를 만든다                              24개
#   monitor   : 자기 시계열 하나만 수집. 주력 칸(ARCHITECTURE §5-6) 전용   7개
#   v0: false : 1차 구현에서는 뺀다                                      4개
#                                                    → v0 발굴 시드 20개
#
#   v0 에서 뺀 넷 — 무스탕(수확 35)·점퍼(50) 은 수확이 낮고,
#   나시(81)·반바지(94) 는 여름 품목이라 지금 돌리면 하강 구간만 보여
#   탐지기가 제대로 도는지 확인하기 어렵다
#
# 2026-10-28 전면 개정. 숫자는 검색광고 키워드도구 **힌트 1개씩 단독 조회** 실측.
#   '수확' = 연관어 중 ①'~시드'로 끝나고 ②제외어 없고 ③월 100~1만 인 키워드 수
#   힌트를 5개씩 묶으면 응답 한도를 나눠 써 뒤쪽이 잘린다 (스커트 15 → 단독 165)
#   연관어가 정확히 1,200 인 시드는 API 상한에 걸린 것이라 수확이 **하한치**다
# ─────────────────────────────────────────────────────────────────────

anchor: "원피스"   # config.yaml anchor.keyword 와 반드시 일치시킬 것

# ── v0 프로파일 — 작게 돌려보는 1차 구현 ─────────────────────────────
# 시드를 줄여도 규모는 별로 안 준다 (24개 3,350 리프 → 20개 3,088, 겨우 8%).
# 레버는 시드 개수가 아니라 **시드당 후보 수**다.
#
# 전체 필터는 월 100~1만이지만 v0 은 대역을 좁힌다. 실측(MODEL §4-0) 근거:
#   월 400 미만   관측률 0.91 · 고유값비 0.63   ← 결측·계단화 대응이 있어야 돈다
#   월 400~4,000  관측률 1.00 · 고유값비 0.80   ← 없어도 돈다
# 깨끗한 구간에서 파이프라인이 도는지부터 보고, 결측·양자화 대응은 그다음에 붙인다.
v0:
  enabled: true
  volume_band: [400, 4000]
  max_children_per_seed: 30
  # 결과: 리프 ~600 · 노드 ~720 · 호출 180회 · 35만 행 (110MB)
  # LLM_MODE=stub 이어도 진행 가능하다

# 폭주 방지용 상한. 품질 장치가 아니다 —
# 규모 상위를 자르면 관련도가 **더 높은** 쪽을 버린다 (발견 ⑩: 규모와 관련도는 반비례).
# 실제 선별은 LLM 이 한다 (ARCHITECTURE §7-0 의 2단계).
max_children_per_seed: 300

seeds:
  # ── 상의 (9) ──
  - {name: 가디건,   role: discovery, yield: 256}   # 상한 걸림
  - {name: 니트,     role: discovery, yield: 230}   # 상한 걸림
  - {name: 조끼,     role: discovery, yield: 190}   # 신규. '베스트'(39)보다 5배 생산적
  - {name: 블라우스, role: discovery, yield: 161}   # 상한 걸림
  - {name: 셔츠,     role: discovery, yield: 140}
  - {name: 티셔츠,   role: discovery, yield: 133}   # 상한 걸림
  - {name: 맨투맨,   role: discovery, yield: 125}   # 상한 걸림
  - {name: 후드티,   role: discovery, yield:  82}   # 상한 걸림
  - {name: 나시,     role: discovery, yield:  81, v0: false}   # 신규. 상한 걸림

  # ── 하의 (7) ──
  - {name: 바지,     role: discovery, yield: 169}   # 신규. 단독 검색이 많은 표기
  - {name: 스커트,   role: discovery, yield: 165}   # 신규. 자식이 새틴·H라인·플레어·A라인
  - {name: 팬츠,     role: discovery, yield: 144}   # 신규. 조합어의 핵 ('와이드팬츠'의 부모)
  - {name: 청바지,   role: discovery, yield: 107}
  - {name: 반바지,   role: discovery, yield:  94, v0: false}   # 신규. 상한 걸림
  - {name: 슬랙스,   role: discovery, yield:  89}
  - {name: 레깅스,   role: discovery, yield:  83}   # 상한 걸림

  # ── 아우터 (7) ──
  - {name: 패딩,     role: discovery, yield: 242}   # 상한 걸림
  - {name: 코트,     role: discovery, yield: 204}
  - {name: 자켓,     role: discovery, yield: 158}   # 상한 걸림
  - {name: 바람막이, role: discovery, yield: 106}   # 상한 걸림
  - {name: 집업,     role: discovery, yield:  97}   # 신규. '후드집업'(월 89,000)의 부모
  - {name: 점퍼,     role: discovery, yield:  50, v0: false}   # 신규
  - {name: 무스탕,   role: discovery, yield:  35, v0: false}

  # ── 원피스 (1) ──
  - {name: 원피스,   role: discovery, yield: 207}   # 상한 걸림. 앵커 겸용

  # ── 관찰 전용 (7) ────────────────────────────────────────────────
  # 앞 다섯은 조합어라 상위 시드가 자식으로 품는다 (수확이 중복된다)
  - {name: 트렌치코트, role: monitor, yield: 23}    # ← 코트
  - {name: 롱스커트,   role: monitor, yield: 39}    # ← 스커트
  - {name: 와이드팬츠, role: monitor, yield: 25}    # ← 팬츠
  - {name: 미니스커트, role: monitor, yield: 13}    # ← 스커트
  - {name: 카고팬츠,   role: monitor, yield:  8}    # ← 팬츠
  # 아래 둘은 발굴이 불가능하지만 자기 검색량은 실재한다
  - {name: 블레이저,   role: monitor, yield:  1}    # 자기 월 14,900 / 연관어 282개뿐
  - {name: 점프수트,   role: monitor, yield:  5}    # 자기 월  3,200

# 뺀 것 (2026-10-28)
#   셋업   연관어가 1개. 검색광고 도구에서 사실상 죽은 말이다. 대체어 '투피스'도 수확 9
#   크롭티 수확 6. '티셔츠'/'나시'가 크롭 수식어를 자식으로 품는다
#   베스트 수확 39 → '조끼'(190) 로 교체. 같은 품목인데 쓰는 말이 다르다

# 발굴 결과 중 제외할 패턴 (발굴 단계에서 바로 거른다)
exclude_patterns:
  - "중고"
  - "대여"
  - "도매"
  - "사입"
  - "쿠폰"
  - "무료배송"
  - "남성"      # 타깃 세그먼트 밖. 실측: '남자가디건' 월 31,630 — 안 거르면 품목 시계열의 절반이 오염된다
  - "남자"
  - "아동"
  - "유아"
  - "키즈"
  - "빅사이즈"

# ── 셀러 확인 대기 ────────────────────────────────────────────────
# 위 목록은 네이버 데이터만 보고 정한 잠정안이다. 첫 미팅에서 확인받는다 → docs/CLIENT.md ①
#   - 안 떼오는 품목이 섞여 있나 (예: 레깅스·바람막이는 애슬레저 쪽이라 취급 안 할 수 있다)
#   - 꼭 봐야 하는데 빠진 품목이 있나
#   - '조끼/베스트', '바지/팬츠' 처럼 같은 품목에 말이 둘인 경우 어느 쪽을 쓰는지
