# 시드 키워드 — 발굴의 출발점
#
# 이 목록 자체가 분석 대상은 아니다. 두 발굴 경로의 **입력**이다.
#   경로 B(검색광고 연관어): 여기 있는 품목을 hintKeywords 로 넣어 연관어를 받는다
#   경로 A(LLM 웹검색):      여기 있는 품목을 축으로 최신 기사에서 신규 표현을 찾는다
#
# 원칙
#   - 품목(아이템) 수준의 범용어만 둔다. "버건디 가디건" 같은 조합어는 발굴 결과지 시드가 아니다
#   - 10~20대 여성 의류에 한정 (config.yaml primary_segment 와 일치)
#   - 20~30개를 넘기지 말 것. 연관어가 기하급수로 늘어난다

anchor: "원피스"   # config.yaml anchor.keyword 와 반드시 일치시킬 것

seeds:
  # ── 상의 ──
  - 블라우스
  - 셔츠
  - 니트
  - 가디건
  - 티셔츠
  - 맨투맨
  - 후드티
  - 크롭티
  - 베스트

  # ── 하의 ──
  - 청바지
  - 슬랙스
  - 와이드팬츠
  - 카고팬츠
  - 레깅스
  - 미니스커트
  - 롱스커트

  # ── 원피스·셋업 ──
  - 원피스
  - 점프수트
  - 셋업

  # ── 아우터 ──
  - 자켓
  - 블레이저
  - 코트
  - 트렌치코트
  - 패딩
  - 무스탕
  - 바람막이

# 발굴 결과 중 제외할 패턴 (정규화 단계에서 걸러낸다)
exclude_patterns:
  - "중고"
  - "대여"
  - "도매"
  - "사입"
  - "쿠폰"
  - "무료배송"
  - "남성"      # 타깃 세그먼트 밖
  - "남자"
  - "아동"
  - "유아"
  - "임부"

# 앵커 후보군 — ARCHITECTURE §6-2 의 타당성 검증에서 이 중 오차가 가장 작은 것을 채택한다
anchor_candidates:
  - 원피스
  - 니트
  - 청바지
  - 가디건
